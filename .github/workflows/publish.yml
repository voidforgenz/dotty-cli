name: Publish

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Compute version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            # Release: extract version from tag (e.g., v1.0.0 -> 1.0.0)
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
            TAG="latest"
          else
            # Canary: use timestamp for unique version
            CURRENT=$(node -p "require('./package.json').version")
            BASE=$(echo "$CURRENT" | sed 's/-.*$//')
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            VERSION="${BASE}-canary.${TIMESTAMP}"
            TAG="canary"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Publishing: $VERSION (tag: $TAG)"

      - name: Update versions
        run: |
          pnpm nx release version ${{ steps.version.outputs.version }} \
            --git-commit=false \
            --git-tag=false

      - name: Build all packages
        run: pnpm nx run-many -t build

      - name: Run tests
        if: github.event_name == 'release'
        run: pnpm nx run-many -t test

      - name: Publish to npm
        run: pnpm nx release publish --tag ${{ steps.version.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Summary
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "### Release Published" >> $GITHUB_STEP_SUMMARY
            echo "Version: \`v${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Install with:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "npm install @dottyfiles/cli" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Canary Published" >> $GITHUB_STEP_SUMMARY
            echo "Version: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Install with:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "npm install @dottyfiles/cli@canary" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
