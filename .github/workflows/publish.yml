name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type or exact version (e.g., patch, minor, major, or 1.2.3)'
        required: true
        default: 'patch'
        type: string
      dry_run:
        description: 'Dry run (no publish, no git changes)'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Configure git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          BASE=$(echo "$CURRENT" | sed 's/-.*$//')

          if [ "${{ github.event_name }}" == "push" ]; then
            # Canary: use timestamp for unique version
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            VERSION="${BASE}-canary.${TIMESTAMP}"
            TAG="canary"
          else
            # Release: use input
            INPUT="${{ inputs.version }}"
            if [[ "$INPUT" =~ ^(patch|minor|major)$ ]]; then
              VERSION=$(npx semver -i "$INPUT" "$CURRENT")
            else
              VERSION="$INPUT"
            fi
            TAG="latest"
          fi

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Publishing: $VERSION (tag: $TAG)"

      - name: Update versions
        run: |
          pnpm nx release version ${{ steps.version.outputs.version }} \
            --git-commit=false \
            --git-tag=false

      - name: Generate changelog
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Check if previous tag exists
          if git rev-parse "v${{ steps.version.outputs.current }}" >/dev/null 2>&1; then
            pnpm nx release changelog ${{ steps.version.outputs.version }} \
              --git-commit=false \
              --git-tag=false \
              --from=v${{ steps.version.outputs.current }}
          else
            # First release - generate changelog from all commits
            pnpm nx release changelog ${{ steps.version.outputs.version }} \
              --git-commit=false \
              --git-tag=false
          fi

      - name: Build all packages
        run: pnpm nx run-many -t build

      - name: Run tests
        if: github.event_name == 'workflow_dispatch'
        run: pnpm nx run-many -t test

      - name: Commit and tag
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          git add -A
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin main --follow-tags

      - name: Publish to npm
        if: github.event_name == 'push' || !inputs.dry_run
        run: pnpm nx release publish --tag ${{ steps.version.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Summary
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "### Canary Published" >> $GITHUB_STEP_SUMMARY
            echo "Version: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Install with:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "npm install @dottyfiles/cli@canary" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "### Dry Run Complete" >> $GITHUB_STEP_SUMMARY
            echo "Would have released: \`v${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Release Published" >> $GITHUB_STEP_SUMMARY
            echo "Version: \`v${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Install with:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "npm install @dottyfiles/cli" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
