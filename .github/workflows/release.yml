name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type or exact version (e.g., patch, minor, major, or 1.2.3)'
        required: true
        default: 'patch'
        type: string
      dry_run:
        description: 'Dry run (no publish, no git changes)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute version
        id: version
        run: |
          INPUT="${{ inputs.version }}"
          CURRENT=$(node -p "require('./package.json').version")

          # Check if input is semver bump type or exact version
          if [[ "$INPUT" =~ ^(patch|minor|major)$ ]]; then
            # Use npm's semver to calculate new version
            NEW=$(npx semver -i "$INPUT" "$CURRENT")
          else
            # Assume it's an exact version
            NEW="$INPUT"
          fi

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "Bumping: $CURRENT → $NEW"

      - name: Update versions
        run: |
          pnpm nx release version ${{ steps.version.outputs.new }} \
            --git-commit=false \
            --git-tag=false

      - name: Generate changelog
        run: |
          pnpm nx release changelog ${{ steps.version.outputs.new }} \
            --git-commit=false \
            --git-tag=false \
            --from=v${{ steps.version.outputs.current }}

      - name: Build all packages
        run: pnpm nx run-many -t build

      - name: Run tests
        run: pnpm nx run-many -t test

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        run: |
          git add -A
          git commit -m "chore(release): v${{ steps.version.outputs.new }}"
          git tag -a "v${{ steps.version.outputs.new }}" -m "Release v${{ steps.version.outputs.new }}"
          git push origin main --follow-tags

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: pnpm nx release publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.new }}" \
            --title "v${{ steps.version.outputs.new }}" \
            --generate-notes

      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "### Dry Run Complete" >> $GITHUB_STEP_SUMMARY
            echo "Would have released: \`v${{ steps.version.outputs.new }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Release Published" >> $GITHUB_STEP_SUMMARY
            echo "Version: \`v${{ steps.version.outputs.new }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Install with:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "npm install @dotty/cli" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
